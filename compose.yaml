services:
  codearts-proxy:
    build:
      context: .
      dockerfile: Dockerfile
    image: codeartsproxy:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${CODEARTS_PORT:-8080}:8080"
    environment:
      CODEARTS_ACCOUNTS_FILE: /run/secrets/accounts.json
      CODEARTS_STATE_DB: /var/lib/codearts-proxy/state.sqlite3
      CODEARTS_INFERENCE_API_KEYS_FILE: /run/secrets/client-keys
      CODEARTS_ADMIN_API_KEY_FILE: /run/secrets/admin-key
      CODEARTS_CHECKIN_MUTATIONS: ${CODEARTS_CHECKIN_MUTATIONS:-false}
      CODEARTS_CHECKIN_CONFIRM: ${CODEARTS_CHECKIN_CONFIRM:-false}
      CODEARTS_UPSTREAM_PROXY: ${CODEARTS_UPSTREAM_PROXY:-}
    volumes:
      - type: bind
        source: ${CODEARTS_SECRETS_DIR:?set an absolute secrets directory outside this checkout}
        target: /run/secrets
        read_only: true
      - codearts_state:/var/lib/codearts-proxy
    read_only: true
    tmpfs:
      - /tmp:size=128m,noexec,nosuid,nodev
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test: ["CMD", "python", "-m", "codearts_proxy.healthcheck"]
      interval: 5m
      timeout: 15s
      retries: 3
      start_period: 20s

volumes:
  codearts_state:
